name: Daily Blog Automation

on:
  schedule:
    - cron: "0 15 * * *"

  workflow_dispatch:


jobs:
  publish-blog:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Debug Project Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f | sort


      - name: Verify Content Package
        run: |
          python - <<'PY'
          import os
          print("content exists:", os.path.exists("content"))
          print("quality_guard exists:", os.path.exists("content/quality_guard.py"))
          if os.path.exists("content"):
              print(os.listdir("content"))
          PY


      - name: Create Blogger Credentials
        run: |
          echo '${{ secrets.CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.TOKEN_JSON }}' > token.json


      - name: Run Blogger Bot
        env:
          PYTHONPATH: ${{ github.workspace }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}

        run: |
          python main.py --publish --schedule


      - name: Save Preview and Receipt
        if: always()
        run: |
          ls -la
          ls -la preview || truename: Daily Blog Automation

